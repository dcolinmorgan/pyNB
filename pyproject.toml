[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyGS"
version = "0.1.0"
description = "Python GENESpider - gene regulatory network inference and benchmarking"
readme = "docs/README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.3.2",
    "pandas>=1.5.0",
    "networkx>=3.2.1",
    "matplotlib>=3.6.3",
    "seaborn>=0.13.2",
    "requests>=2.31.0",
    "PyYAML",
    "sparselink>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "ipykernel>=7.1.0"]
test = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
causal = ["causal-learn"]
deep = ["torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
