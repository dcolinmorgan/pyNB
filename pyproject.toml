[project]
name = "pyGS"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.4.0",
    "matplotlib>=3.6.3",
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "pandas>=1.5.0",
    "requests>=2.31.0",
    "scanpy>=1.8.2",
    "scikit-learn>=1.3.2",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
    "PyYAML",
    "pulp>=2.8.0",
    "tables>=3.10.2",
]

[project.optional-dependencies]
workflow = [
    "snakemake",
]

[tool.uv]
override-dependencies = [
    "tables>=3.10.2",
]
default-groups = ["dev"]

# Pre-declare scenicplus metadata so uv skips cloning/building during resolution.
# The real transitive deps will be pulled when actually installing with --group scenic.
dependency-metadata = [
    { name = "scenicplus", version = "1.0a2", requires-dist = [], requires-python = ">=3.8" },
]

[tool.uv.sources]
scenicplus = { git = "https://github.com/aertslab/scenicplus.git" }

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0.0",
]
scenic = [
    "scenicplus",
]
