[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyGS"
version = "1.0.0"
description = "Python GENESpider - gene regulatory network inference and benchmarking"
readme = "docs/README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.3.2",
    "pandas>=1.5.0",
    "networkx>=3.2.1",
    "matplotlib>=3.6.3",
    "seaborn>=0.13.2",
    "requests>=2.31.0",
    "PyYAML",
    "sparselink",
    "ipython>=9.10.0",
    "scanpy>=1.11.5",
]

[project.scripts]
pygs = "bench.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "ipykernel>=7.1.0"]
test = ["pytest", "pytest-cov"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
causal = ["causal-learn"]
deep = ["torch>=2.0"]
scenic = ["pycistopic @ git+https://github.com/aertslab/pycisTopic.git", "setuptools<81"]
netzoo = ["netzoopy>=0.10"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/analyze", "src/bench", "src/bio", "src/bootstrap", "src/datastruct", "src/methods"]

[tool.hatch.build.targets.wheel.force-include]
"src/config.py" = "config.py"
"src/deprecation.py" = "deprecation.py"

[tool.mypy]
strict = true
packages = ["methods", "datastruct", "analyze", "bootstrap", "bio"]
exclude = ["_vendor/", "egg-info/"]

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "pandas.*",
    "causallearn.*",
    "torch.*",
    "scanpy.*",
    "yaml.*",
    "networkx.*",
    "matplotlib.*",
    "seaborn.*",
    "requests.*",
    "cvxpy.*",
    "graphistry.*",
    "graph_tool.*",
    "nb_fdr.*",
    "arboreto.*",
    "src.bootstrap.nb_fdr",
    "src.integration",
    "methods._vendor.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "methods._vendor.*"
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/bootstrap/compute_density.py" = ["F821"]
"src/bootstrap/generate_plots.py" = ["F821"]
"src/bootstrap/nb_fdr_analysis.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["methods", "datastruct", "analyze", "bootstrap", "bio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
override-dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "macs2 ; python_version < '0'",
    "polars ; python_version < '0'",
    "ray ; python_version < '0'",
    "scatac-fragment-tools ; python_version < '0'",
    "lda ; python_version < '0'",
    "tmtoolkit ; python_version < '0'",
]
