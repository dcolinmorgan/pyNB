site_name: pyGS & sparselink
site_description: Gene regulatory network inference and benchmarking
repo_url: https://github.com/dcolinmorgan/pyGS
repo_name: dcolinmorgan/pyGS
docs_dir: docs/site

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src, sparselink/src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Method Comparison: methods.md
  - API Reference:
      - sparselink: api/sparselink.md
      - sparselink.methods: api/methods.md
      - sparselink.bench: api/bench.md
      - pyGS.bio: api/bio.md
  - Contributing: contributing.md
  - Versioning & Deprecation: versioning.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
