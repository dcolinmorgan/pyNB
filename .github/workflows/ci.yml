name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint pyGS
        run: ruff check src/ tests/
      - name: Lint sparselink
        run: ruff check sparselink/src/ sparselink/tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install sparselink
        run: pip install -e "./sparselink[test]"
      - name: Install pyGS
        run: pip install -e ".[test]"
      - name: Run sparselink tests
        run: pytest sparselink/tests/ --cov=sparselink --cov-report=xml:sparselink-coverage.xml -q
      - name: Run pyGS tests
        run: pytest tests/ --cov=src --cov-report=xml:pygs-coverage.xml -q
