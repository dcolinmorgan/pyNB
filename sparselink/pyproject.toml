[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparselink"
version = "0.1.0"
description = "Domain-agnostic sparse network inference from tabular data"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pandas>=1.5",
]

[project.optional-dependencies]
causal = ["causal-learn"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparselink"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py310"
