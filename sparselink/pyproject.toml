[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparselink"
version = "1.0.0"
description = "Domain-agnostic sparse network inference from tabular data"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pandas>=1.5",
]

[project.scripts]
sparselink-bench = "sparselink.bench.cli:main"

[project.optional-dependencies]
causal = ["causal-learn"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]
test = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
deep = ["torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparselink"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pandas.*", "causallearn.*", "torch.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
